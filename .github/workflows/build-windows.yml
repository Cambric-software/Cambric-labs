name: Build Windows Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.6)'
        required: true
        default: '0.1.6'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Create build directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron/build
          Get-ChildItem electron/build

      - name: Build Windows executable
        run: |
          cd electron
          npm run build
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Verify Windows executables
        run: |
          echo "=== Verifying Windows Executables ==="
          echo "Release files:"
          Get-ChildItem electron/release -Filter "*.exe" -Recurse | Select-Object Name, Length, LastWriteTime
          
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-windows
          path: |
            electron/release/**/*.exe
            !electron/release/**/*portable*.exe
          retention-days: 30

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-windows-portable
          path: electron/release/**/*portable*.exe
          retention-days: 30

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Delete existing release if exists
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release exists, deleting..."
            gh release delete ${{ github.ref_name }} --yes
          else
            echo "No existing release found"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
          body: |
            ## CAMBRIC LABS v${{ github.ref_name }}
            
            ### Downloads
            - **Windows Installer**: CAMBRIC-LABS-*-Setup.exe
            - **Windows Portable**: CAMBRIC-LABS-*-portable.exe (no installation required)
            - **Android**: Cambric-Labs-Android-*.apk
            
            ### Features
            - Local neural network training (no internet required)
            - Create and train neural networks
            - Visualize weights and gradients
            - Export trained models
            - Works completely offline
            - No account required
            
            ### System Requirements
            
            **Windows:**
            - Windows 10 or later
            - 4GB RAM minimum
            - 200MB disk space
            
            **Android:**
            - Android 7.0 (API 24) or later
            - 2GB RAM minimum
            - 100MB storage space
            
            ### Installation
            
            **Windows:**
            1. Download the installer or portable version
            2. Run the installer (or extract the portable version)
            3. Launch CAMBRIC LABS
            
            **Android:**
            1. Download the APK to your Android device
            2. Enable "Install from unknown sources" in settings
            3. Open the APK file to install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
