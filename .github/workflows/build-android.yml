name: Build Android Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Capacitor
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Check frontend build output
        run: |
          ls -la docs/

      - name: Initialize Capacitor
        run: |
          cd frontend
          # Initialize Capacitor only if not already initialized
          if [ ! -f "capacitor.config.ts" ]; then
            npx cap init "CAMBRIC LABS" "com.cambric.labs" --web-dir=../docs
          fi

      - name: Add Android platform
        run: |
          cd frontend
          # Add Android only if not already present
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor to Android
        run: |
          cd frontend
          npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Android APK
        run: |
          cd frontend/android
          # Create gradle.properties to resolve Kotlin version conflicts
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\nkotlin.code.style=official\norg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError\n' > gradle.properties
          # Add resolution strategy to app/build.gradle to fix Kotlin duplicate classes
          if [ -f app/build.gradle ] && ! grep -q "resolutionStrategy" app/build.gradle; then
            printf '\nconfigurations.all {\n    resolutionStrategy {\n        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n    }\n}\n' >> app/build.gradle
          fi
          ./gradlew assembleRelease
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-android-release-${{ github.event.inputs.version || github.ref_name }}
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-android-debug-${{ github.event.inputs.version || github.ref_name }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  create-release:
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.apk
          body: |
            ## CAMBRIC LABS Android v${{ github.ref_name }}
            
            ### Downloads
            - **Release APK**: For production use
            - **Debug APK**: For testing
            
            ### Features
            - Local neural network training (no internet required)
            - Create and train small neural networks
            - Visualize weights and gradients
            - Save and load projects locally
            
            ### System Requirements
            - Android 7.0 (API 24) or later
            - 2GB RAM minimum
            - 100MB storage space
            
            ### Installation
            1. Download the APK to your Android device
            2. Enable "Install from unknown sources" in settings
            3. Open the APK file to install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
