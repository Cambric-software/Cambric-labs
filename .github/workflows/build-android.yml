name: Build Android Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.6)'
        required: true
        default: '0.1.6'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Capacitor
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Check frontend build output
        run: |
          ls -la docs/
          ls -la docs/app/ 2>/dev/null || echo "No app directory found"

      - name: Initialize Capacitor
        run: |
          cd frontend
          # Initialize Capacitor only if not already initialized
          if [ ! -f "capacitor.config.ts" ]; then
            npx cap init "CAMBRIC LABS" "com.cambric.labs" --web-dir=../docs/app
          fi

      - name: Add Android platform
        run: |
          cd frontend
          # Add Android only if not already present
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor to Android
        run: |
          cd frontend
          npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Configure Gradle properties
        run: |
          cd frontend/android
          # Create gradle.properties to resolve Kotlin version conflicts
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\nkotlin.code.style=official\norg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError\n' > gradle.properties
          # Add resolution strategy to app/build.gradle to fix Kotlin duplicate classes
          if [ -f app/build.gradle ] && ! grep -q "resolutionStrategy" app/build.gradle; then
            printf '\nconfigurations.all {\n    resolutionStrategy {\n        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n    }\n}\n' >> app/build.gradle
          fi

      - name: Decode release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; cannot produce a signed release APK"
            exit 1
          fi
          # Decode the keystore into the runner's temp dir (outside the repo,
          # automatically cleared after the job; never committed to git).
          KEYSTORE_PATH="$RUNNER_TEMP/cambric-release.keystore"
          # Write the secret to a temp file, then strip ALL whitespace
          # (newlines/CR/spaces from copy-paste wrapping) before base64-decoding.
          B64_RAW="$RUNNER_TEMP/keystore.b64"
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' > "$B64_RAW"
          B64_LEN=$(wc -c < "$B64_RAW")
          echo "Raw base64 input length: $B64_LEN bytes"
          # Check for characters outside the base64 alphabet (does not print values).
          if tr -d 'A-Za-z0-9+/=\n\r \t' < "$B64_RAW" | grep -q .; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains characters outside the base64 alphabet; re-store the secret as clean single-line base64"
            exit 1
          fi
          tr -d '[:space:]' < "$B64_RAW" > "$RUNNER_TEMP/keystore.clean.b64"
          rm -f "$B64_RAW"
          CLEAN_LEN=$(wc -c < "$RUNNER_TEMP/keystore.clean.b64")
          echo "Stripped base64 length: $CLEAN_LEN bytes (mod 4: $(( CLEAN_LEN % 4 )))"
          # Recover missing '=' padding if the stored value was stripped of it.
          MOD=$(( CLEAN_LEN % 4 ))
          if [ "$MOD" -ne 0 ]; then
            PADDING=$(( 4 - MOD ))
            printf '%0.s=' $(seq 1 "$PADDING") >> "$RUNNER_TEMP/keystore.clean.b64"
            echo "Appended $PADDING padding character(s)."
          fi
          base64 -d "$RUNNER_TEMP/keystore.clean.b64" > "$KEYSTORE_PATH"
          rm -f "$RUNNER_TEMP/keystore.clean.b64"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty; ANDROID_KEYSTORE_BASE64 did not decode to a valid keystore"
            exit 1
          fi
          echo "Keystore decoded to runner temp (size: $(stat -c %s "$KEYSTORE_PATH") bytes)"
          file "$KEYSTORE_PATH"
          # Validate that the result is a real PKCS12 keystore and that the
          # expected alias is present. keytool -list -v prints the alias and
          # the public certificate info (incl. SHA-256 fingerprint); it never
          # prints the password or the private key material.
          if ! keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keytool.out" 2>&1; then
            echo "::error::Decoded keystore is not a valid PKCS12 keystore, or ANDROID_KEYSTORE_PASSWORD is wrong"
            sed -E 's/[A-Za-z0-9+/]{40,}/***MASKED***/g' "$RUNNER_TEMP/keytool.out"
            exit 1
          fi
          if ! grep -qi "Keystore type: PKCS12" "$RUNNER_TEMP/keytool.out"; then
            echo "::error::Keystore is not PKCS12 type"
            sed -E 's/[A-Za-z0-9+/]{40,}/***MASKED***/g' "$RUNNER_TEMP/keytool.out"
            exit 1
          fi
          echo "keytool keystore validation PASSED"
          # Print only non-sensitive public certificate metadata.
          grep -iE "Keystore type|Keystore provider|Alias name|SHA256|Valid from" "$RUNNER_TEMP/keytool.out" || true
          if ! grep -qi "Alias name: ${EXPECTED_ALIAS}" "$RUNNER_TEMP/keytool.out"; then
            echo "::error::Expected alias '${EXPECTED_ALIAS}' not found in keystore"
            sed -E 's/[A-Za-z0-9+/]{40,}/***MASKED***/g' "$RUNNER_TEMP/keytool.out"
            exit 1
          fi
          echo "Alias '${EXPECTED_ALIAS}' present in keystore."
          rm -f "$RUNNER_TEMP/keytool.out"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease --init-script "$GITHUB_WORKSPACE/.github/android/init-signing.gradle"
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Verify signed Release APK
        run: |
          set -euo pipefail
          echo "=== Verifying Release APK ==="
          SIGNED_APK="frontend/android/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$UNSIGNED_APK" ]; then
            echo "::error::Release build produced an UNSIGNED APK ($UNSIGNED_APK); signing configuration did not take effect"
            exit 1
          fi
          if [ ! -f "$SIGNED_APK" ]; then
            echo "::error::No release APK found at $SIGNED_APK"
            find frontend/android/app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "Signed Release APK found: $SIGNED_APK"
          ls -lh "$SIGNED_APK"

          # apksigner (from build-tools) verifies the v1/v2/v3 signature and
          # prints the signing certificate. Only public cert info is shown.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT=""
          if [ -n "$SDK_ROOT" ]; then
            BT=$(find "$SDK_ROOT" -name apksigner -type f 2>/dev/null | head -1)
          fi
          if [ -z "$BT" ]; then
            echo "::warning::apksigner not found on runner; skipping signature verification step"
          else
            echo "Using apksigner: $BT"
            "$BT" verify --print-certs "$SIGNED_APK" && echo "apksigner verification PASSED"
          fi

      - name: Rename Release APK
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          RENAMED_PATH="frontend/android/app/build/outputs/apk/release/Cambric-Labs-Android-${VERSION}.apk"
          cp "$APK_PATH" "$RENAMED_PATH"
          echo "Renamed APK to: $RENAMED_PATH"
          ls -lh "$RENAMED_PATH"

      - name: Remove decoded keystore from runner
        if: always()
        run: |
          if [ -n "${{ env.ANDROID_KEYSTORE_PATH }}" ] && [ -f "${{ env.ANDROID_KEYSTORE_PATH }}" ]; then
            rm -f "${{ env.ANDROID_KEYSTORE_PATH }}"
            echo "Decoded keystore removed from runner."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-android-release
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cambric-labs-android-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  create-release:
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Upload APK to Release
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} | \
            python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          for apk in artifacts/cambric-labs-android-release/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $apk..."
              FILENAME=$(basename "$apk")
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$apk" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FILENAME"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
